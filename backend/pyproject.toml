[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fireopt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.28",
    "numpy>=2.1",
    "scipy>=1.14",
    "cachetools>=5.5",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "supabase>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "factory-boy>=3.3",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fireopt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
