<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireOpt — Unified Header Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2e; --navy-mid:#162438; --navy-light:#1e3450; --slate:#2a4060;
  --gold:#c9a84c; --gold-light:#e8c97a; --gold-pale:#f5e9c8;
  --cream:#faf7f2; --white:#ffffff;
  --text-primary:#0d1b2e; --text-secondary:#4a6080; --text-muted:#7a96b0;
  --border:rgba(201,168,76,0.2); --border-light:rgba(13,27,46,0.08);
  --success:#1a8a5a; --success-light:#e8f7f0; --warning:#b8620a; --danger:#c0392b;
  --radius:12px; --radius-lg:20px;
  --shadow:0 4px 24px rgba(13,27,46,0.08); --shadow-lg:0 12px 48px rgba(13,27,46,0.15);
  --shadow-gold:0 4px 24px rgba(201,168,76,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-primary);overflow-x:hidden;}

/* ─────────── DEMO HARNESS (not part of app) ─────────── */
.harness{position:fixed;top:0;left:0;right:0;z-index:500;background:#07101d;color:#fff;display:flex;align-items:center;gap:18px;padding:8px 18px;border-bottom:1px solid rgba(201,168,76,0.25);flex-wrap:wrap;}
.harness .h-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--gold-light);font-weight:600;}
.harness .h-seg{display:flex;background:rgba(255,255,255,0.08);border-radius:8px;padding:3px;gap:2px;}
.harness .h-seg button{background:transparent;border:none;color:rgba(255,255,255,0.65);font-family:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer;transition:.15s;}
.harness .h-seg button.on{background:var(--gold);color:var(--navy);}
.harness .h-readout{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,0.75);}
.harness .h-chip{font-family:'DM Mono',monospace;font-weight:500;padding:3px 10px;border-radius:20px;font-size:12px;}
.h-chip.bad{background:rgba(192,57,43,0.2);color:#ff9b8f;border:1px solid rgba(192,57,43,0.4);}
.h-chip.good{background:rgba(26,138,90,0.2);color:#7ff0bf;border:1px solid rgba(26,138,90,0.4);}
.h-chip.save{background:rgba(201,168,76,0.18);color:var(--gold-light);border:1px solid rgba(201,168,76,0.4);}
.harness .h-note{font-size:11px;color:rgba(255,255,255,0.5);}
.viewport{margin-top:48px;}

/* ─────────── SHARED APP TOKENS ─────────── */
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:30px;height:30px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);font-size:15px;flex-shrink:0;}
.logo-text{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--white);letter-spacing:-0.3px;white-space:nowrap;}
.toggle-group{display:inline-flex;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:8px;padding:3px;gap:2px;}
.toggle-opt{background:transparent;border:none;color:rgba(255,255,255,0.7);font-family:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;transition:.15s;white-space:nowrap;}
.toggle-opt.active{background:var(--gold);color:var(--navy);}
.save-btn{background:var(--gold);color:var(--navy);border:none;padding:7px 16px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.save-btn:hover{background:var(--gold-light);}
.btn-ghost{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.14);padding:7px 12px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.btn-ghost:hover{background:rgba(255,255,255,0.14);color:#fff;}
.overflow-btn{background:rgba(255,255,255,0.07);color:#fff;border:1px solid rgba(255,255,255,0.14);width:34px;height:34px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;}

/* ─────────── CURRENT: three stacked bars ─────────── */
.cur-topbar{background:var(--navy);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(201,168,76,0.15);}
.cur-topbar .actions{display:flex;align-items:center;gap:12px;}
.cur-primary{background:var(--white);border-bottom:2px solid rgba(13,27,46,0.14);padding:0 28px;display:flex;align-items:stretch;justify-content:center;position:relative;box-shadow:0 2px 8px rgba(13,27,46,0.06);}
.cur-primary .ptab{display:inline-flex;align-items:center;padding:18px 34px;font-size:16px;font-weight:700;color:var(--text-muted);border-bottom:3px solid transparent;margin-bottom:-2px;letter-spacing:0.8px;text-transform:uppercase;cursor:pointer;}
.cur-primary .ptab.active{color:var(--navy);border-bottom-color:var(--gold);}
.cur-primary .ptoggle{position:absolute;right:28px;top:50%;transform:translateY(-50%);}
.cur-primary .toggle-group{background:rgba(13,27,46,0.05);border-color:var(--border-light);}
.cur-primary .toggle-opt{color:var(--text-secondary);} .cur-primary .toggle-opt.active{color:var(--navy);}
.cur-subtabs{display:flex;gap:2px;background:#eef0f4;padding:0 28px;border-bottom:2px solid rgba(13,27,46,0.18);}
.cur-subtabs .stab{display:inline-flex;align-items:center;padding:12px 22px;font-size:13px;font-weight:600;color:var(--text-secondary);border-bottom:3px solid transparent;margin-bottom:-2px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;white-space:nowrap;}
.cur-subtabs .stab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:700;}

/* ─────────── REDESIGN: single unified appbar ─────────── */
.appbar{background:var(--navy);height:60px;display:flex;align-items:center;gap:22px;padding:0 24px;border-bottom:1px solid rgba(201,168,76,0.18);}
.appbar .logo-text{font-size:19px;}
.appbar .app-nav{display:flex;align-items:stretch;gap:2px;height:100%;}
.appbar .atab{display:inline-flex;align-items:center;height:100%;padding:0 18px;font-size:15px;font-weight:600;color:rgba(255,255,255,0.62);border-bottom:3px solid transparent;letter-spacing:0.3px;cursor:pointer;white-space:nowrap;transition:.15s;}
.appbar .atab:hover{color:rgba(255,255,255,0.9);}
.appbar .atab.active{color:var(--gold-light);border-bottom-color:var(--gold);}
.appbar .nav-divider{width:1px;background:rgba(255,255,255,0.18);margin:15px 10px;}
.appbar .app-right{margin-left:auto;display:flex;align-items:center;gap:12px;}

/* ─────────── CONTENT (mirrors current app; identical in both modes) ─────────── */
.page-body{padding:18px 26px 60px;max-width:1180px;margin:0 auto;}
.panel{background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.panel-header{min-height:46px;display:flex;align-items:center;justify-content:center;position:relative;padding:0 18px;border-bottom:1px solid var(--border-light);}
.panel-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-secondary);}
.panel-title .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
.panel-hdr-right{position:absolute;right:14px;top:50%;transform:translateY(-50%);}
.panel-body{padding:16px 18px;}

.mockchart{height:230px;border-radius:10px;background:
  linear-gradient(180deg,rgba(201,168,76,0.10),rgba(201,168,76,0) 60%),
  repeating-linear-gradient(90deg,rgba(13,27,46,0.04) 0 1px,transparent 1px 64px),
  repeating-linear-gradient(0deg,rgba(13,27,46,0.04) 0 1px,transparent 1px 44px);
  position:relative;border:1px solid var(--border-light);}
.mockchart svg{position:absolute;inset:0;width:100%;height:100%;}
.mockchart.tall{height:300px;}

.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.metric-card{background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.metric-label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;}
.metric-value{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;margin-top:4px;color:var(--navy);}
.metric-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}

/* Plan Summary banner — all 8 stats on one line (as in live app) */
.summary{background:var(--navy);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;color:#fff;}
.summary .s-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.summary .badge{background:var(--success-light);color:var(--success);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.summary .s-link{margin-left:auto;color:var(--gold-light);font-size:12px;text-decoration:underline;cursor:pointer;}
.summary .s-stats{display:flex;align-items:stretch;gap:0;overflow-x:auto;}
.summary .hs{flex:1;min-width:0;padding:0 14px;border-right:1px solid rgba(255,255,255,0.1);white-space:nowrap;}
.summary .hs:last-child{border-right:none;}
.summary .hs .k-l{font-size:10px;text-transform:uppercase;letter-spacing:0.7px;color:var(--gold-light);font-weight:600;}
.summary .hs .k-v{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;margin-top:2px;}

.benefit{background:rgba(13,27,46,0.03);border:1px solid var(--border-light);border-radius:var(--radius);padding:11px 16px;margin-bottom:16px;display:flex;gap:26px;flex-wrap:wrap;}
.benefit .b{font-size:12px;color:var(--text-secondary);} .benefit .b b{color:var(--success);font-family:'DM Mono',monospace;}

/* StrategyChooser — Roth mode is a customization BUTTON (as in live app) */
.strat .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.strat .row:last-child{margin-bottom:0;}
.strat .rl{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;width:96px;}
.chip{background:rgba(13,27,46,0.05);border:1px solid var(--border-light);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;}
.chip.on{background:var(--gold-pale);border-color:var(--gold);color:var(--navy);}
.btn-outline{background:transparent;border:1px solid var(--gold);color:var(--navy);border-radius:8px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;}
.btn-reopt{margin-left:auto;background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;}

/* WhatIfBar */
.whatif{padding:12px 16px;}
.whatif .wtitle{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.whatif .live{background:var(--success-light);color:var(--success);font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;}
.whatif .wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.slider-card{background:rgba(13,27,46,0.02);border:1px solid var(--border-light);border-radius:10px;padding:9px 12px;}
.slider-card label{font-size:11px;color:var(--text-muted);font-weight:600;}
.slider-card .sv{font-family:'DM Mono',monospace;font-size:15px;color:var(--navy);margin:2px 0 6px;}
.slider-card input[type=range]{width:100%;accent-color:var(--gold);}

.hint{font-size:12px;color:var(--text-muted);padding:8px 2px;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin:18px 0 8px;}
.form-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:12px;}
.form-group label{font-size:11px;color:var(--text-muted);font-weight:600;display:block;margin-bottom:4px;}
.form-group input{width:100%;padding:8px 10px;border:1.5px solid rgba(13,27,46,0.22);border-radius:8px;font-family:inherit;font-size:13px;}
.inline-input{display:flex;align-items:center;gap:6px;}
.inline-input label{font-size:12px;color:var(--text-secondary);font-weight:600;}
.inline-input input{width:64px;padding:5px 8px;border:1.5px solid rgba(13,27,46,0.22);border-radius:7px;font-family:'DM Mono',monospace;font-size:13px;}
.tax-toggle{display:flex;gap:2px;}
.tax-toggle button{background:rgba(13,27,46,0.05);border:1px solid var(--border-light);color:var(--text-secondary);font-family:inherit;font-size:12px;font-weight:600;padding:6px 14px;cursor:pointer;}
.tax-toggle button:first-child{border-radius:8px 0 0 8px;} .tax-toggle button:last-child{border-radius:0 8px 8px 0;}
.tax-toggle button.on{background:var(--gold-pale);border-color:var(--gold);color:var(--navy);}

@media (max-width:820px){
  .metrics-grid{grid-template-columns:repeat(2,1fr);}
  .whatif .wgrid,.form-row{grid-template-columns:repeat(2,1fr);}
  .logo-text{display:none;}
}
</style>
</head>
<body>

<div class="harness">
  <span class="h-title">FireOpt · Unified Header</span>
  <div class="h-seg" id="modeSeg">
    <button data-mode="current">Current (3 bars)</button>
    <button data-mode="redesign" class="on">Redesign (unified)</button>
  </div>
  <div class="h-readout">
    <span class="h-note">top chrome:</span>
    <span class="h-chip" id="chromeChip">—</span>
    <span class="h-chip save" id="saveChip">—</span>
  </div>
</div>

<div class="viewport">
  <div id="header"></div>
  <div id="content"></div>
</div>

<script>
const TABS = [
  {id:'inputs', label:'Inputs', group:'setup'},
  {id:'dashboard', label:'Dashboard', group:'results'},
  {id:'projections', label:'Projections', group:'results'},
  {id:'taxes', label:'Taxes', group:'results'},
  {id:'montecarlo', label:'Monte Carlo', group:'results'},
];
let state = { mode:'redesign', tab:'dashboard', display:'real' };

function chromeHeight(){
  if(state.mode==='current') return 64 + 56 + (state.tab!=='inputs'?43:0);
  return 60;
}
function updateReadout(){
  const h = chromeHeight();
  const chip = document.getElementById('chromeChip');
  chip.textContent = h + 'px'; chip.className = 'h-chip ' + (h>100?'bad':'good');
  const saved = (state.tab==='inputs'?120:163) - 60;
  const s = document.getElementById('saveChip');
  s.style.display = state.mode==='redesign' ? '' : 'none';
  s.textContent = '+'+saved+'px content vs current';
}

/* ───────── HEADERS (the ONLY thing that changes between modes) ───────── */
function currentHeader(){
  const onResults = state.tab!=='inputs';
  const subtabs = TABS.filter(t=>t.group==='results').map(t=>
    `<div class="stab ${state.tab===t.id?'active':''}" onclick="go('${t.id}')">${t.label}</div>`).join('');
  return `
  <div class="cur-topbar">
    <div class="logo"><div class="logo-mark">R</div><div class="logo-text">Retirement Optimizer</div></div>
    <div class="actions">
      <button class="btn-ghost">How-to Guide</button><button class="btn-ghost">Reset Plan</button>
      <button class="btn-ghost">Import</button><button class="save-btn">Export Plan</button>
    </div>
  </div>
  <div class="cur-primary">
    <div class="ptab ${state.tab==='inputs'?'active':''}" onclick="go('inputs')">Inputs</div>
    <div class="ptab ${onResults?'active':''}" onclick="go('dashboard')">Results</div>
    <div class="ptoggle"><div class="toggle-group">
      <button class="toggle-opt ${state.display==='real'?'active':''}" onclick="setDisp('real')">Today's $</button>
      <button class="toggle-opt ${state.display==='nominal'?'active':''}" onclick="setDisp('nominal')">Nominal $</button>
    </div></div>
  </div>
  ${onResults?`<div class="cur-subtabs">${subtabs}</div>`:''}`;
}
function redesignHeader(){
  const setup = TABS.filter(t=>t.group==='setup');
  const results = TABS.filter(t=>t.group==='results');
  const tab = t=>`<div class="atab ${state.tab===t.id?'active':''}" onclick="go('${t.id}')">${t.label}</div>`;
  return `
  <div class="appbar">
    <div class="logo"><div class="logo-mark">R</div><div class="logo-text">Retirement Optimizer</div></div>
    <nav class="app-nav">${setup.map(tab).join('')}<div class="nav-divider"></div>${results.map(tab).join('')}</nav>
    <div class="app-right">
      <div class="toggle-group">
        <button class="toggle-opt ${state.display==='real'?'active':''}" onclick="setDisp('real')">Today's $</button>
        <button class="toggle-opt ${state.display==='nominal'?'active':''}" onclick="setDisp('nominal')">Nominal $</button>
      </div>
      <button class="save-btn">Export</button>
      <button class="overflow-btn" title="How-to · Import · Reset">⋮</button>
    </div>
  </div>`;
}

/* ───────── SHARED MOCK PIECES ───────── */
const wave = (c,o)=>`<svg viewBox="0 0 600 230" preserveAspectRatio="none"><path d="M0 190 C 90 160, 150 120, 230 110 S 380 70, 460 50 S 560 30, 600 22 L600 230 L0 230 Z" fill="${c}" opacity="${o}"/><path d="M0 190 C 90 160, 150 120, 230 110 S 380 70, 460 50 S 560 30, 600 22" fill="none" stroke="${c}" stroke-width="2.5"/></svg>`;
const mockChart = t=>`<div class="mockchart ${t?'tall':''}">${wave('#c9a84c',0.18)}</div>`;
const metric = (l,v,s)=>`<div class="metric-card"><div class="metric-label">${l}</div><div class="metric-value">${v}</div><div class="metric-sub">${s}</div></div>`;

/* ───────── PAGE CONTENT (identical in both modes — mirrors current app) ───────── */
function inputsPage(){
  return `<div class="page-body" style="max-width:960px">
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Personal Details</div></div>
      <div class="panel-body">
        <div class="form-row">
          <div class="form-group"><label>Name</label><input value="Alex"></div>
          <div class="form-group"><label>Date of birth</label><input value="1975-04-02"></div>
          <div class="form-group"><label>Retirement age</label><input value="62"></div>
          <div class="form-group"><label>Plan to age</label><input value="95"></div>
        </div>
        <div class="section-label">State of residence</div>
        <div class="form-row">
          <div class="form-group"><label>State</label><input value="Illinois"></div>
          <div class="form-group"><label>ACA SLCSP</label><input value="$14,400"></div>
        </div>
      </div></div>
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Income &amp; Expenses</div></div>
      <div class="panel-body"><div class="hint">Income &amp; expense stream rows… (single scrolling form)</div></div></div>
    <div class="hint">Inputs page unchanged. Header only: <b>120px → 52px</b>.</div>
  </div>`;
}
function dashboardPage(){
  const hs=(l,v)=>`<div class="hs"><div class="k-l">${l}</div><div class="k-v">${v}</div></div>`;
  return `<div class="page-body">
    <div class="summary">
      <div class="s-top"><span class="badge">✓ On track</span><span class="s-link">Explain rationale →</span></div>
      <div class="s-stats">
        ${hs('Ending balance','$3.4M')}${hs('Lifetime tax','$612K')}${hs('Success rate','94%')}${hs('Roth converted','$488K')}
        ${hs('RMD peak','$142K')}${hs('SS start','Age 70')}${hs('IRMAA yrs','3')}${hs('Est. estate','$3.9M')}
      </div>
    </div>
    <div class="benefit"><div class="b">Tax saved <b>+$71K</b></div><div class="b">Balance Δ <b>+$210K</b></div><div class="b">IRMAA avoided <b>2 yrs</b></div><div class="b">Bracket cap <b>22%</b></div></div>
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Adjust Withdrawal Strategies</div></div>
      <div class="panel-body strat">
        <div class="row"><div class="rl">Optimize for:</div><span class="chip on">Max end balance</span><span class="chip">Min tax</span><span class="chip">Max spending</span><button class="btn-reopt">↗ Re-optimize</button></div>
        <div class="row"><div class="rl">Withdrawal:</div><span class="chip">Tax-first</span><span class="chip">Roth-first</span><span class="chip">Trad-first</span><span class="chip">Proportional</span><span class="chip on">Bracket-fill</span><span class="chip">Custom</span><button class="btn-outline" style="margin-left:auto">⚙ Roth Conversion Mode</button></div>
      </div></div>
    <div class="panel"><div class="panel-body whatif">
      <div class="wtitle"><span class="live">● live</span>What-if · live overlay</div>
      <div class="wgrid">
        <div class="slider-card"><label>Retire age</label><div class="sv">62</div><input type="range" value="62"></div>
        <div class="slider-card"><label>Portfolio return</label><div class="sv">6.5%</div><input type="range" value="65"></div>
        <div class="slider-card"><label>Inflation</label><div class="sv">2.8%</div><input type="range" value="28"></div>
        <div class="slider-card"><label>Spending ×</label><div class="sv">1.0×</div><input type="range" value="100"></div>
      </div></div></div>
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Portfolio Trajectory</div></div>
      <div class="panel-body">${mockChart(true)}</div></div>
  </div>`;
}
function projectionsPage(){
  return `<div class="page-body">
    <div class="panel"><div class="panel-body whatif">
      <div class="wtitle"><span class="live">● live</span>What-if · live overlay</div>
      <div class="wgrid">
        <div class="slider-card"><label>Retire age</label><div class="sv">62</div><input type="range" value="62"></div>
        <div class="slider-card"><label>Portfolio return</label><div class="sv">6.5%</div><input type="range" value="65"></div>
        <div class="slider-card"><label>Inflation</label><div class="sv">2.8%</div><input type="range" value="28"></div>
        <div class="slider-card"><label>Spending ×</label><div class="sv">1.0×</div><input type="range" value="100"></div>
      </div></div></div>
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Annual Cash Flows</div></div>
      <div class="panel-body">${mockChart()}</div></div>
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Year-by-Year Detail</div>
      <div class="panel-hdr-right"><button class="chip">⤓ Download CSV</button></div></div>
      <div class="panel-body"><div class="hint">Expandable projection table…</div></div></div>
  </div>`;
}
function taxesPage(){
  return `<div class="page-body">
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Tax Planning</div>
      <div class="panel-hdr-right"><div class="tax-toggle"><button class="on">Federal</button><button>State</button><button>IRMAA</button></div></div></div>
      <div class="panel-body">${mockChart()}</div></div>
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Cumulative Tax — Baseline vs Optimized</div></div>
      <div class="panel-body">${mockChart()}</div></div>
  </div>`;
}
function monteCarloPage(){
  return `<div class="page-body">
    <div class="panel"><div class="panel-body" style="padding:12px 16px">
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div class="inline-input"><label>Equity %</label><input value="60"></div>
        <div class="inline-input"><label>Bond %</label><input value="40" readonly></div>
        <div class="inline-input"><label>Trials</label><input value="500"></div>
        <div style="flex:1"></div>
        <button class="save-btn" style="background:var(--gold)">▶ Run Simulation</button>
        <button class="btn-outline">Optimize for Robustness</button>
      </div>
      <div class="hint" style="margin-top:4px">Blocks of real S&amp;P 500 + Treasury returns stitched randomly… 500 trials ≈ 1–2s.</div>
    </div></div>
    <div class="metrics-grid">
      ${metric('Probability of Success','94%','500 trials · 60/40')}
      ${metric('Median Final','$3.4M',"50th pct · today's $")}
      ${metric('10th Percentile','$1.1M','Adverse scenario')}
      ${metric('90th Percentile','$6.2M','Favorable scenario')}
    </div>
    <div class="panel"><div class="panel-header"><div class="panel-title"><span class="dot"></span>Portfolio Distribution</div></div>
      <div class="panel-body">${mockChart(true)}</div></div>
  </div>`;
}
function renderContent(){
  return {inputs:inputsPage,dashboard:dashboardPage,projections:projectionsPage,taxes:taxesPage,montecarlo:monteCarloPage}[state.tab]();
}

/* ───────── RENDER + EVENTS ───────── */
function render(){
  document.getElementById('header').innerHTML = state.mode==='current'?currentHeader():redesignHeader();
  document.getElementById('content').innerHTML = renderContent();
  updateReadout();
}
function go(tab){ state.tab=tab; render(); }
function setDisp(d){ state.display=d; render(); }
document.getElementById('modeSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.mode=b.dataset.mode;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
render();
</script>
</body>
</html>
